<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>풀이체커 Teacher</title>
<style>
:root{--green:#176b3a;--green2:#0f5530;--bg:#f4f7fb;--card:#fff;--line:#dce5ef;--text:#14213d;--muted:#6b7280;--red:#c62828;--redbg:#fff1f1;--yellow:#9a6500;--yellowbg:#fff8e8;--ok:#137333;--okbg:#edf8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.top{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;padding:20px 18px 18px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:21px}.top p{margin:6px 0 0;opacity:.85;font-size:13px}.wrap{max-width:820px;margin:0 auto;padding:18px}.drop{display:block;background:#fff;border:2px dashed #bdc9d9;border-radius:24px;padding:34px 18px;text-align:center;cursor:pointer;box-shadow:0 8px 25px rgba(20,33,61,.06)}.drop .icon{font-size:42px}.drop b{display:block;font-size:25px;margin:8px 0}.drop span{color:var(--muted);line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.btn{border:0;border-radius:17px;padding:16px;font-size:18px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#e8edf5;color:var(--text)}.btn:disabled{opacity:.45;cursor:not-allowed}.list{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 8px 28px rgba(20,33,61,.06)}.photo{position:relative;background:#e8eef5;min-height:180px;display:flex;justify-content:center;align-items:center}.photo img{width:100%;max-height:520px;object-fit:contain;display:block;cursor:zoom-in}.status{position:absolute;top:14px;right:14px;background:#fff;border-radius:999px;padding:8px 13px;font-weight:800;box-shadow:0 4px 15px #0002}.status.error{color:var(--red)}.status.done{color:var(--ok)}.status.running{color:var(--yellow)}.body{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:start}.head h3{margin:0 0 5px}.meta{color:var(--muted);font-size:14px;word-break:break-all}.linkbtn{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}.progress{margin-top:15px;height:8px;background:#e9eef4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:45%;background:var(--green);border-radius:99px;animation:move 1.2s infinite ease-in-out}@keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}.result{margin-top:15px}.verdict{border-radius:16px;padding:14px 16px;font-size:19px;font-weight:900}.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.bad{background:var(--redbg);color:var(--red)}.verdict.warn{background:var(--yellowbg);color:var(--yellow)}.section{margin-top:12px;padding:15px;border-radius:16px;border:1px solid var(--line)}.section h4{margin:0 0 9px}.issue{padding:10px 0;border-top:1px solid var(--line)}.issue:first-of-type{border-top:0}.wrong{color:var(--red);font-weight:700}.correct{color:var(--ok);font-weight:700}.note{margin-top:12px;color:#475569}.errorbox{margin-top:15px;background:var(--redbg);border:1px solid #f1bcbc;border-radius:18px;padding:16px;color:#8d1717}.errorbox h4{margin:0 0 10px;font-size:19px}.errorbox b{display:block;margin-top:10px}.errorbox ul{margin:6px 0 0;padding-left:20px}.retry{margin-top:12px;border:0;background:#b42318;color:#fff;padding:12px 16px;border-radius:12px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:30px}.small{font-size:12px;color:var(--muted);margin-top:7px}@media(max-width:560px){.wrap{padding:14px}.drop{padding:28px 14px}.drop b{font-size:22px}.actions{gap:9px}.btn{font-size:17px;padding:15px 9px}.card{border-radius:20px}}
.modal{position:fixed;inset:0;background:rgba(5,12,24,.92);display:none;align-items:center;justify-content:center;z-index:1000;padding:18px}.modal.open{display:flex}.modal img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px #0008}.modal-close{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:46px;height:46px;border:0;border-radius:999px;background:#fff;color:#111;font-size:28px;line-height:1;cursor:pointer}.modal-tip{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;background:#0008;padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap}</style>
</head>
<body>
<header class="top"><h1>풀이체커 Teacher</h1><p>계산 실수와 꼭 확인해야 할 논리 비약만 표시합니다.</p></header>
<main class="wrap">
<label class="drop"><input id="files" type="file" accept="image/*" multiple hidden><div class="icon">📷</div><b>사진 업로드</b><span>클릭해서 사진을 선택하세요. 최대 6장.<br>업로드 전 자동으로 축소해 전송합니다.</span></label>
<div class="actions"><button id="analyzeAll" class="btn primary" disabled>전체 분석</button><button id="clearAll" class="btn secondary" disabled>전체 삭제</button></div>
<section id="list" class="list"><div class="empty">아직 업로드한 사진이 없습니다.</div></section>
</main>
<div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="풀이 사진 확대 보기"><button id="modalClose" class="modal-close" aria-label="닫기">×</button><img id="modalImage" alt="확대된 학생 풀이"><div class="modal-tip">화면을 터치하거나 ×를 누르면 닫힙니다.</div></div>
<script>
const MAX_FILES=6, MAX_SIDE=1400, QUALITY=.78;
const input=document.querySelector('#files'), list=document.querySelector('#list'), analyzeAll=document.querySelector('#analyzeAll'), clearAll=document.querySelector('#clearAll'), imageModal=document.querySelector('#imageModal'), modalImage=document.querySelector('#modalImage'), modalClose=document.querySelector('#modalClose');
let items=[];
const fmt=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function resize(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,MAX_SIDE/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',QUALITY))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('이미지를 읽지 못했습니다.'))};img.src=url})}
function statusText(s){return {ready:'대기',running:'분석중',done:'완료',error:'오류'}[s]||'대기'}
function renderResult(r){if(!r)return'';const cls=r.verdict==='맞음'?'ok':r.verdict==='틀림'?'bad':'warn';let html=`<div class="result"><div class="verdict ${cls}">${esc(r.display_verdict||r.verdict)}</div>`;if(!r.calculation_mistakes?.length&&!r.logical_gaps?.length){html+=`<div class="section"><h4>계산 실수</h4>없음</div>`}else{html+=`<div class="section"><h4>계산 실수</h4>${r.calculation_mistakes?.length?r.calculation_mistakes.map(x=>`<div class="issue"><b>${esc(x.line)}</b><div class="wrong">학생: ${esc(x.student_expression)}</div><div class="correct">수정: ${esc(x.correct_expression)}</div>${x.reason?`<div>${esc(x.reason)}</div>`:''}</div>`).join(''):'없음'}</div>`;if(r.logical_gaps?.length)html+=`<div class="section"><h4>🔴 논리 비약 발견</h4>${r.logical_gaps.map(x=>`<div class="issue"><b>${esc(x.line)}</b><div>${esc(x.issue)}</div></div>`).join('')}</div>`}if(r.teacher_note)html+=`<div class="note">${esc(r.teacher_note)}</div>`;html+=`<div class="small">판독 ${esc(r.readability||'-')} · 확신도 ${Number(r.confidence)||0}%</div></div>`;return html}
function renderError(e){if(!e)return'';return `<div class="errorbox"><h4>❌ ${esc(e.title||'분석 실패')}</h4><b>원인</b><div>${esc(e.cause||'알 수 없는 오류')}</div>${e.suggestions?.length?`<b>해결 방법</b><ul>${e.suggestions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="small">오류 코드: ${esc(e.code||'-')}</div><button class="retry">다시 분석</button></div>`}
function openImage(src,alt='학생 풀이 확대'){modalImage.src=src;modalImage.alt=alt;imageModal.classList.add('open');document.body.style.overflow='hidden'}
function closeImage(){imageModal.classList.remove('open');modalImage.removeAttribute('src');document.body.style.overflow=''}
modalClose.onclick=closeImage;imageModal.onclick=e=>{if(e.target===imageModal||e.target===modalImage)closeImage()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&imageModal.classList.contains('open'))closeImage()});
function render(){analyzeAll.disabled=!items.length||items.some(x=>x.status==='running');clearAll.disabled=!items.length||items.some(x=>x.status==='running');if(!items.length){list.innerHTML='<div class="empty">아직 업로드한 사진이 없습니다.</div>';return}list.innerHTML=items.map((it,i)=>`<article class="card" data-i="${i}"><div class="photo"><img class="zoomable" src="${it.preview}" alt="학생 풀이 ${i+1}" title="터치해서 확대"><span class="status ${it.status}">${statusText(it.status)}</span></div><div class="body"><div class="head"><div><h3>학생 풀이 ${i+1}</h3><div class="meta">${esc(it.file.name)} · ${fmt(it.file.size)}</div></div><button class="linkbtn remove">삭제</button></div>${it.status==='running'?'<div class="progress"><i></i></div>':''}${renderResult(it.result)}${renderError(it.error)}</div></article>`).join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=e=>{const i=+e.target.closest('.card').dataset.i;URL.revokeObjectURL(items[i].preview);items.splice(i,1);render()});document.querySelectorAll('.retry').forEach(b=>b.onclick=e=>analyzeOne(+e.target.closest('.card').dataset.i));document.querySelectorAll('.zoomable').forEach(img=>img.onclick=()=>openImage(img.src,img.alt))}
input.onchange=()=>{const files=[...input.files].filter(f=>f.type.startsWith('image/')).slice(0,MAX_FILES-items.length);for(const file of files)items.push({file,preview:URL.createObjectURL(file),status:'ready',result:null,error:null});input.value='';render()};clearAll.onclick=()=>{items.forEach(x=>URL.revokeObjectURL(x.preview));items=[];render()};
async function analyzeOne(i){const it=items[i];if(!it||it.status==='running')return;it.status='running';it.error=null;it.result=null;render();try{const imageDataUrl=await resize(it.file);const res=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({imageDataUrl})});const data=await res.json().catch(()=>({}));if(!res.ok)throw {info:data.error_info||{title:`분석 실패 (${res.status})`,cause:data.error||'서버 응답 오류',suggestions:['잠시 후 다시 시도하세요.'],code:String(res.status)}};it.result=data;it.status='done'}catch(err){it.status='error';it.error=err.info||{title:'분석 실패',cause:err.message||'네트워크 또는 서버 오류',suggestions:['인터넷 연결을 확인하세요.','잠시 후 다시 분석하세요.'],code:'CLIENT_ERROR'}}render()}
analyzeAll.onclick=async()=>{for(let i=0;i<items.length;i++)if(items[i].status!=='done')await analyzeOne(i)};
render();
</script>
</body>
</html>
